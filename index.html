<html lang="de">
<head>

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
@font-face{font-family:"Press Start 2P";src:url("font.woff2") format("woff2");font-display:block}
*{box-sizing:border-box}
html{background:#14101b;overscroll-behavior:none}
body{margin:0;position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:none}
[hidden]{display:none!important}
/* Online: jeder sieht nur seine eigenen Tasten, dafür größer */
.app.online .pad{display:none;--bs:clamp(58px, 15vw, 90px)}
.app.online.me0 .pad.p1,.app.online.me1 .pad.p2{display:flex}
.topbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.topbtns .mute{position:static}
/* Menü */
.menu{position:fixed;inset:0;z-index:20;background:rgba(20,16,27,.93);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.menu-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;text-align:center;margin:auto}
.logo{margin:0;font-size:clamp(20px,6vw,30px);font-weight:normal;color:#e0413f;text-shadow:3px 3px 0 #7a1420;letter-spacing:.04em}
.menu section{display:flex;flex-direction:column;gap:12px}
.mbtn{-webkit-appearance:none;appearance:none;font-family:var(--pixel);font-size:11px;letter-spacing:.06em;line-height:1.5;padding:16px 14px;border:0;border-radius:10px;
  background:var(--btn);color:#e8e6f0;box-shadow:0 4px 0 var(--btn-low);cursor:pointer}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--btn-low)}
.mbtn:focus-visible,.menu input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mbtn.hot{background:var(--p1);box-shadow:0 4px 0 var(--p1-low);color:#fff}
.mbtn.blue{background:var(--p2);box-shadow:0 4px 0 var(--p2-low);color:#fff}
.mbtn.ghost{background:transparent;box-shadow:none;border:1px solid var(--shell-edge);color:var(--label)}
.mbtn.lvl{display:flex;flex-direction:column;gap:8px;align-items:center}
.mbtn.lvl small{font-size:8px;letter-spacing:.04em;opacity:.75}
.or{font-size:8px;line-height:1.8;letter-spacing:.08em;color:var(--label-dim);margin-top:8px}
.join-row{display:flex;gap:10px}
.join-row input{flex:1 1 auto;min-width:0;font-family:var(--pixel);font-size:16px;letter-spacing:.3em;text-align:center;text-transform:uppercase;
  background:#0d0912;border:2px solid var(--shell-edge);border-radius:10px;color:var(--accent);padding:12px 8px;
  user-select:text;-webkit-user-select:text;touch-action:auto}
.join-row input::placeholder{color:var(--label-dim)}
.lbl{margin:0;font-size:9px;letter-spacing:.12em;color:var(--label-dim)}
.code{margin:0;font-size:clamp(30px,10vw,44px);letter-spacing:.2em;color:var(--accent);text-shadow:3px 3px 0 #6b5d2a}
.hint{margin:0;font-size:9px;line-height:1.9;color:var(--label)}
.hint:empty{display:none}
.err{margin:0;font-size:10px;line-height:1.9;color:#ff9a8a}
@media (orientation: landscape) and (pointer: coarse) and (max-height: 520px){
  .app.online .pad{--bs:64px}
  .menu-in{gap:12px}
  .mbtn{padding:12px}
}
</style>
<style>
/* Ein Tablet, zwei Spieler: Arena oben, Spieler 1 links unten, Spieler 2 rechts unten. Handy quer: Tasten über dem Bild. */
:root{
  --body:#14101b;
  --shell:#1f1929;
  --shell-edge:#32294a;
  --btn:#3a2f4f;
  --btn-low:#241c32;
  --btn-hi:#4b3e66;
  --label:#a99bbf;
  --label-dim:#6a5f80;
  --p1:#e2733a;
  --p1-low:#8a3d17;
  --p2:#4aa3e8;
  --p2-low:#1f5a8a;
  --accent:#f7d51d;
  --pixel:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--body);color:var(--label);font-family:var(--pixel);
  overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
.app{
  height:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px;
}
.screen-wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
.bezel{position:relative;background:#09070d;padding:5px;border-radius:8px;box-shadow:0 0 0 2px var(--shell-edge),0 10px 30px rgba(0,0,0,.45)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;width:320px;height:180px}
.mute{
  position:absolute;top:8px;right:8px;font-family:var(--pixel);font-size:8px;color:var(--label);
  background:rgba(20,16,27,.75);border:1px solid var(--shell-edge);border-radius:4px;padding:6px 7px;cursor:pointer;
}
.mute:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.pads{flex:0 0 auto;display:flex;gap:14px;padding-bottom:env(safe-area-inset-bottom, 0px)}
.pad{
  --bs:clamp(46px, 7.4vw, 78px);
  --pc:var(--p1);--pc-low:var(--p1-low);
  flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 14px;border-radius:14px;background:var(--shell);
  box-shadow:inset 0 3px 0 var(--pc);position:relative;
}
.pad.p2{--pc:var(--p2);--pc-low:var(--p2-low)}
.tag{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:.12em;color:var(--body);background:var(--pc);padding:4px 8px;border-radius:4px}
.grp{display:flex;gap:10px;align-items:flex-end}
.btn{
  -webkit-appearance:none;appearance:none;border:0;cursor:pointer;display:grid;place-items:center;
  font-family:var(--pixel);touch-action:none;transition:transform .04s, box-shadow .04s;
}
.dir{width:var(--bs);height:var(--bs);border-radius:14px;background:var(--btn);box-shadow:0 5px 0 var(--btn-low), inset 0 2px 0 var(--btn-hi)}
.dir svg{width:38%;height:38%;fill:var(--label)}
.act{width:var(--bs);height:var(--bs);border-radius:50%;font-size:calc(var(--bs) * .22);color:rgba(255,255,255,.88)}
.act.jump{background:var(--pc);box-shadow:0 5px 0 var(--pc-low), inset 0 2px 0 rgba(255,255,255,.2);margin-bottom:calc(var(--bs) * .4)}
.act.shoot{background:var(--btn);color:var(--pc);box-shadow:0 5px 0 var(--btn-low), inset 0 2px 0 var(--btn-hi)}
.btn.on{transform:translateY(4px)}
.dir.on,.act.shoot.on{box-shadow:0 1px 0 var(--btn-low);background:var(--btn-hi)}
.act.jump.on{box-shadow:0 1px 0 var(--pc-low)}

.keys{display:none;justify-content:center;flex-wrap:wrap;gap:8px 28px;font-size:8px;line-height:2;color:var(--label-dim)}
.keys b{font-weight:normal}
.keys .k1 b{color:var(--p1)} .keys .k2 b{color:var(--p2)}
.keys kbd{font-family:var(--pixel);color:var(--label);border:1px solid var(--shell-edge);border-radius:3px;padding:2px 5px;background:var(--shell)}

/* Handy quer: wenig Höhe, Tasten schweben über dem Bild */
@media (orientation: landscape) and (pointer: coarse) and (max-height: 520px){
  .app{padding-block:4px}
  .pads{position:fixed;left:0;right:0;bottom:0;pointer-events:none;
    padding-left:calc(10px + env(safe-area-inset-left, 0px));padding-right:calc(10px + env(safe-area-inset-right, 0px));
    padding-bottom:calc(8px + env(safe-area-inset-bottom, 0px))}
  .pad{background:transparent;box-shadow:none;padding:0;--bs:52px}
  .tag{display:none}
  .btn{pointer-events:auto;opacity:.7}
}
/* Computer mit Maus: Tastatur statt Touch-Tasten */
@media (hover: hover) and (pointer: fine){
  .pads{display:none}
  .keys{display:flex}
}
</style>

</head>
<body>
<div class="app" id="app">
  <div class="screen-wrap" id="wrap">
    <div class="bezel"><canvas id="game" width="320" height="180" aria-label="Arena"></canvas></div>
    <div class="topbtns"><button class="mute" id="b-menu" type="button">MENÜ</button><button class="mute" id="mute" type="button" aria-pressed="false">TON AN</button></div>
  </div>
  <div class="pads" id="pads">
    <div class="pad p1">
      <span class="tag">P1</span>
      <div class="grp">
        <button class="btn dir" id="p1-left" data-k="0:left" type="button" aria-label="Spieler 1 links"><svg viewBox="0 0 10 10"><polygon points="7,1 2,5 7,9"/></svg></button>
        <button class="btn dir" id="p1-right" data-k="0:right" type="button" aria-label="Spieler 1 rechts"><svg viewBox="0 0 10 10"><polygon points="3,1 8,5 3,9"/></svg></button>
      </div>
      <div class="grp">
        <button class="btn act shoot" id="p1-shoot" data-k="0:shoot" type="button" aria-label="Spieler 1 schießen">B</button>
        <button class="btn act jump" id="p1-jump" data-k="0:jump" type="button" aria-label="Spieler 1 springen">A</button>
      </div>
    </div>
    <div class="pad p2">
      <span class="tag">P2</span>
      <div class="grp">
        <button class="btn dir" id="p2-left" data-k="1:left" type="button" aria-label="Spieler 2 links"><svg viewBox="0 0 10 10"><polygon points="7,1 2,5 7,9"/></svg></button>
        <button class="btn dir" id="p2-right" data-k="1:right" type="button" aria-label="Spieler 2 rechts"><svg viewBox="0 0 10 10"><polygon points="3,1 8,5 3,9"/></svg></button>
      </div>
      <div class="grp">
        <button class="btn act shoot" id="p2-shoot" data-k="1:shoot" type="button" aria-label="Spieler 2 schießen">B</button>
        <button class="btn act jump" id="p2-jump" data-k="1:jump" type="button" aria-label="Spieler 2 springen">A</button>
      </div>
    </div>
  </div>
  <div class="keys">
    <span class="k1"><b>P1</b> <kbd>A</kbd><kbd>D</kbd> laufen · <kbd>W</kbd> springen · <kbd>F</kbd> schießen</span>
    <span class="k2"><b>P2</b> <kbd>←</kbd><kbd>→</kbd> laufen · <kbd>↑</kbd> springen · <kbd>L</kbd> schießen</span>
    <span>Controller gehen auch</span>
  </div>
</div>

<div class="menu" id="menu">
  <div class="menu-in">
    <h1 class="logo">RUINENDUELL</h1>
    <section id="m-main">
      <button class="mbtn" id="b-bot" type="button">GEGEN DEN BOT</button>
      <button class="mbtn" id="b-local" type="button">ZU ZWEIT AN EINEM GERÄT</button>
      <div class="or">ODER ONLINE, JEDER AM EIGENEN HANDY</div>
      <button class="mbtn hot" id="b-host" type="button">SPIEL ERSTELLEN</button>
      <div class="join-row">
        <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" aria-label="Spielcode">
        <button class="mbtn blue" id="b-join" type="button">BEITRETEN</button>
      </div>
      <p class="hint" id="join-hint"></p>
    </section>
    <section id="m-bot" hidden>
      <p class="lbl">WIE STARK SOLL DER BOT SEIN?</p>
      <button class="mbtn lvl" id="b-easy" type="button">LEICHT<small>Zum Reinkommen</small></button>
      <button class="mbtn lvl" id="b-mid" type="button">MITTEL<small>Sucht Waffen, weicht aus</small></button>
      <button class="mbtn lvl hot" id="b-hard" type="button">SCHWER<small>Trifft fast immer</small></button>
      <button class="mbtn ghost" id="b-bot-back" type="button">ZURÜCK</button>
    </section>
    <section id="m-host" hidden>
      <p class="lbl">DEIN SPIELCODE</p>
      <p class="code" id="host-code">----</p>
      <p class="hint">Dein Freund öffnet das Spiel, tippt den Code ein und drückt BEITRETEN.</p>
      <button class="mbtn hot" id="b-share" type="button">LINK SCHICKEN</button>
      <p class="hint" id="host-status"></p>
      <button class="mbtn ghost" id="b-cancel-host" type="button">ABBRECHEN</button>
    </section>
    <section id="m-join" hidden>
      <p class="hint" id="join-status"></p>
      <button class="mbtn ghost" id="b-cancel-join" type="button">ABBRECHEN</button>
    </section>
    <section id="m-err" hidden>
      <p class="err" id="err-msg"></p>
      <button class="mbtn" id="b-back" type="button">ZURÜCK ZUM MENÜ</button>
    </section>
  </div>
</div>
<script src="peerjs.min.js"></script>
<script>
(()=>{
const W=320,H=180,GROUND=160,GRAV=0.28,LEFT=2,RIGHT=318,WIN_ROUNDS=3;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const wrap=document.getElementById('wrap');const FONT='"Press Start 2P"';
const PCOL=['#e2733a','#4aa3e8'],PCOL_D=['#8a3d17','#1f5a8a'];

function fit(){
  const r=wrap.getBoundingClientRect();
  let s=Math.min((r.width-10)/W,(r.height-10)/H);
  if(s>=2)s=Math.floor(s*2)/2;s=Math.max(0.5,s);
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
}
new ResizeObserver(fit).observe(wrap);fit();

/* ---------- Sprites ---------- */
function sprite(rows,pal,white){
  const h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(ch==='.'||!pal[ch])continue;x.fillStyle=white?'#fff':pal[ch];x.fillRect(i,j,1,1);}
  return c;
}
const TOP=["...hhhh...","..hhhhhh..","..hhssse..","..hssss...","...sss....","..jjjjj...",".jjjjjj...",".jjjjjs...","..jjjj...."];
const LEGS={stand:["..pppp....","..pp.pp...","..pp..p...","..bb..bb.."],walk:["..pppp....","..ppppp...",".pp...pp..",".bb....bb."],walk2:["..pppp....","..pppp....","..p..pp...","..b...bb.."],jump:["..pppp....","..pppppp..","..pp...p..","..bb...bb."]};
const PPAL=[
  {h:'#6b3d1f',s:'#f2b382',e:'#1a1030',j:'#e2733a',p:'#2d3a5a',b:'#1e1a22'},
  {h:'#e8cf6a',s:'#d9996a',e:'#1a1030',j:'#4aa3e8',p:'#3b2f3a',b:'#1e1a22'}
];
const PS=PPAL.map(pal=>{const o={};for(const k in LEGS){o[k]=sprite(TOP.concat(LEGS[k]),pal);o[k+'W']=sprite(TOP.concat(LEGS[k]),pal,true);}return o;});
const Z_A=["...zzz....","..zzzzz...","..zzrzr...","..zzzzz...","...zdz....","..tttzzzzz","..tttt....","..ttttzzzz","..tttt....","..oooo....","..oo.oo...","..oo..o...","..zz..zz.."];
const Z_B=["...zzz....","..zzzzz...","..zzrzr...","..zzzzz...","...zdz....","..ttttzzzz","..tttt....","..tttzzzzz","..tttt....","..oooo....","..ooooo...",".oo...oo..",".zz....zz."];
const ZPAL={z:'#7fb850',r:'#ff3b3b',d:'#3a1a1a',t:'#6b5a4a',o:'#3b3550'};
const ZS={a:sprite(Z_A,ZPAL),b:sprite(Z_B,ZPAL),fa:sprite(Z_A,ZPAL,true),fb:sprite(Z_B,ZPAL,true)};
function draw(img,x,y,flip,s=1){
  const w=img.width*s,h=img.height*s;
  if(flip){ctx.save();ctx.translate(x+w,y);ctx.scale(-1,1);ctx.drawImage(img,0,0,w,h);ctx.restore();}else ctx.drawImage(img,x,y,w,h);
}

/* ---------- Waffen ---------- */
const WEAPONS={
  pistol:{name:'PISTOLE',cd:16,dmg:7,spd:4.6,ammo:Infinity,kb:1.3,life:80,len:3},
  shotgun:{name:'SCHROT',cd:44,dmg:7,pellets:5,spread:0.32,spd:4.4,ammo:6,kb:2.3,life:26,len:7},
  mg:{name:'MG',cd:6,dmg:4,spd:5.2,ammo:45,spread:0.07,kb:0.7,life:80,len:8},
  sniper:{name:'GEWEHR',cd:62,dmg:30,spd:9,ammo:5,kb:3.8,life:60,len:10},
  nade:{name:'GRANATE',cd:42,dmg:36,radius:30,ammo:3,kb:4.2,len:2},
  raygun:{name:'RAYGUN',cd:50,dmg:999,spd:6,ammo:3,kb:5,life:80,len:7}
};
const PICKPAL={k:'#5a5f68',l:'#9aa0a8',w:'#7a4a24',d:'#2a2e35',s:'#111016',m:'#2f4a3a',g:'#4f6b3a',G:'#7f9f5a',r:'#c0c6d4',c:'#3bd13b',C:'#b8ff9e',o:'#7a2f4f',e:'#ececf2',x:'#d23b3b',y:'#9a9aa8'};
const PICK={
  shotgun:sprite(["....llllllll","wwwwkkkkkkkk","www..k......","ww.........."],PICKPAL),
  mg:sprite(["...kkkkkkkk.","kkkkkkkkkkkk","kk..dd..k...","k...dd......","....dd......"],PICKPAL),
  sniper:sprite(["....sss.......","wwmmmmmmmmmmmm","ww.m..........","w............."],PICKPAL),
  nade:sprite([".ll..","..g..",".ggg.","ggGgg","ggggg",".ggg."],PICKPAL),
  med:sprite(["yyyyyyyy","yeeexeey","yeeexeey","yxxxxxxy","yeeexeey","yeeexeey","yyyyyyyy"],PICKPAL),
  raygun:sprite(["...cccc.....",".rrrrrrrrC..","rrcrcrcrrrCC",".rrrrrrrrC..","..oo........","..oo........"],PICKPAL)
};
const LOOT=[['shotgun',3],['mg',3],['sniper',2],['nade',2],['med',2],['raygun',1]];
function newPick(loot,x,y,vy,life,para){const im=PICK[loot];return {x,y,w:im.width,h:im.height,vy,loot,life,para:!!para};}
function rollLoot(){let t=0;for(const l of LOOT)t+=l[1];let r=Math.random()*t;for(const l of LOOT){if((r-=l[1])<0)return l[0];}return 'mg';}

/* ---------- Arena ---------- */
const PLATS=[{x:36,y:124,w:64},{x:220,y:124,w:64},{x:122,y:94,w:76},{x:14,y:68,w:56},{x:250,y:68,w:56}];
const SOLIDS=[{x:143,y:GROUND-14,w:34,h:14,type:'car'}];

/* ---------- Ton ---------- */
let actx=null,master,sfxG,musG,noiseBuf,muted=false,musicOn=false,nextNote=0,step=0;
function initAudio(){
  if(actx){if(actx.state!=='running')actx.resume();return;}
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=muted?0:0.8;master.connect(actx.destination);
    sfxG=actx.createGain();sfxG.connect(master);musG=actx.createGain();musG.gain.value=0.5;musG.connect(master);
    noiseBuf=actx.createBuffer(1,actx.sampleRate,actx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){actx=null;}
}
function tone(f,dur,o={}){
  if(!actx)return;const t=actx.currentTime+(o.delay||0),osc=actx.createOscillator(),g=actx.createGain();
  osc.type=o.type||'square';osc.frequency.setValueAtTime(f,t);if(o.slide)osc.frequency.exponentialRampToValueAtTime(o.slide,t+dur);
  g.gain.setValueAtTime(o.vol||0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);osc.connect(g);g.connect(o.dest||sfxG);osc.start(t);osc.stop(t+dur+0.02);
}
function noise(dur,o={}){
  if(!actx)return;const t=actx.currentTime+(o.delay||0),src=actx.createBufferSource(),f=actx.createBiquadFilter(),g=actx.createGain();
  src.buffer=noiseBuf;f.type=o.ftype||'lowpass';f.frequency.value=o.freq||2000;g.gain.setValueAtTime(o.vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f);f.connect(g);g.connect(o.dest||sfxG);src.start(t,Math.random()*0.5);src.stop(t+dur+0.02);
}
const sfx={
  pistol(){noise(0.08,{vol:0.2,freq:3200});tone(620,0.06,{slide:120,vol:0.05});},
  shotgun(){noise(0.22,{vol:0.32,freq:1600});tone(180,0.15,{slide:50,vol:0.08});},
  mg(){noise(0.05,{vol:0.14,freq:4000});},
  sniper(){noise(0.04,{vol:0.3,freq:9000,ftype:'highpass'});tone(1400,0.12,{slide:200,vol:0.06});noise(0.3,{vol:0.12,freq:600,delay:0.03});},
  toss(){tone(300,0.12,{slide:600,vol:0.04,type:'triangle'});},

  for(const s of SOLIDS)if(hit(e,s)){if(e.vx>0)e.x=s.x-e.w;else if(e.vx<0)e.x=s.x+s.w;e.hitWall=true;}
  const prevB=e.y+e.h;e.y+=e.vy;e.onGround=false;
  if(e.y<-40){e.y=-40;e.vy=0;}
  if(e.y+e.h>=GROUND){e.y=GROUND-e.h;e.vy=0;e.onGround=true;}
  for(const s of SOLIDS)if(hit(e,s)){if(e.vy>0){e.y=s.y-e.h;e.vy=0;e.onGround=true;}else if(e.vy<0){e.y=s.y+s.h;e.vy=0;}}

  }
}

/* ---------- Bot ---------- */
const RANGE={pistol:[50,120],mg:[40,100],shotgun:[14,36],sniper:[90,220],nade:[50,100],raygun:[30,220]};
function botReset(){bot.goal=null;bot.think=0;bot.hist=[];bot.jh=0;bot.prevOut=false;bot.drop=0;const o=bot.inp;o.left=o.right=o.jump=o.shoot=false;}
function botUpdate(){
  const L=BOT[botLvl],b=players[1],op=players[0],o=bot.inp;
  o.left=o.right=o.shoot=false;let jump=false,mv=0;
  if(b.dead){o.jump=false;return;}
  bot.hist.push({x:op.x,y:op.y,dead:op.dead});while(bot.hist.length>L.react+1)bot.hist.shift();
  const seen=bot.hist[0],alive=!seen.dead;
  let zt=null;
  for(const z of zombies){const d=Math.abs(z.x-b.x)+Math.abs(z.y-b.y);if(d<60&&(!zt||d<zt.d))zt={x:z.x,y:z.y,d};}
  const tgt=zt&&(!alive||zt.d<Math.abs(seen.x-b.x))?zt:(alive?{x:seen.x,y:seen.y}:null);
  if(--bot.think<=0){
    bot.think=L.react+((Math.random()*8)|0);
    let goal=null,best=null;
    if(Math.random()<L.loot)for(const c of crates){
      if(c.para&&c.y<50)continue;
      const want=c.loot==='med'?b.hp<70:c.loot==='raygun'?b.wep!=='raygun':(b.wep==='pistol'||(b.ammo<5&&b.wep!=='raygun'));if(!want)continue;
      const d=Math.abs(c.x-b.x)+Math.abs(c.y-b.y)*1.5;if(!best||d<best.d)best={d,x:c.x+1,y:c.y+c.h-13};
    }
    if(best)goal={x:best.x,y:best.y,exact:true};
    else if(alive){
      const [mn,mx]=RANGE[b.wep],dx=seen.x-b.x,dist=Math.abs(dx),c=SOLIDS[0];let gx=b.x;
      if(Math.abs(seen.y-b.y)>20){gx=seen.x+(Math.sign(b.x-seen.x)||1)*16;}
      else{
        if(dist>mx)gx=seen.x-Math.sign(dx)*(mx-12);
        else if(dist<mn)gx=seen.x-(Math.sign(dx)||1)*(mn+12);
        if(gx<10||gx>W-16)gx=seen.x+(Math.sign(dx)||1)*(mn+12);
        if(seen.y+13>=GROUND-2){if(seen.x+3<c.x)gx=Math.min(gx,c.x-10);else if(seen.x>c.x+c.w)gx=Math.max(gx,c.x+c.w+4);}
      }
      goal={x:Math.max(8,Math.min(W-14,gx)),y:seen.y};
    }
    bot.goal=goal;
  }
  const g=bot.goal;
  if(g){
    const dx=g.x-b.x,dy=g.y-b.y;
    if(Math.abs(dx)>(g.exact?2:6))mv=Math.sign(dx);
    if(dy<-18&&b.onGround&&Math.abs(dx)<44&&Math.random()<L.climb*0.15)jump=true;
    if(dy>18){
      const pl=b.onGround?PLATS.find(q=>Math.abs(b.y+b.h-q.y)<1&&b.x+b.w>q.x&&b.x<q.x+q.w):null;
      if(pl){if(!bot.drop)bot.drop=g.x<pl.x?-1:g.x>pl.x+pl.w?1:(b.x-pl.x<pl.x+pl.w-b.x?-1:1);mv=bot.drop;}
      else if(!b.onGround&&bot.drop)mv=bot.drop;
    }else bot.drop=0;
    if(b.hitWall&&b.onGround&&mv)jump=true;
    if(!b.onGround&&b.jumps===1&&b.vy>-0.6&&dy<-10&&Math.random()<L.climb)jump=true;
  }
  if(L.dodge>0){
    for(const u of bullets){
      if(u.owner===1)continue;const d=b.x-u.x;
      if(Math.sign(d)===Math.sign(u.vx)&&Math.abs(d)<46&&u.y>=b.y-1&&u.y<=b.y+14){if(b.onGround&&Math.random()<L.dodge*0.3)jump=true;break;}
    }
    for(const n of nades){if(Math.hypot(n.x-b.x,n.y-b.y)<42&&Math.random()<L.dodge){mv=Math.sign(b.x-n.x)||1;if(b.onGround&&n.fuse<30)jump=true;}}
  }
  if(L.speed<1&&!bot.drop&&Math.random()>L.speed)mv=0;
  if(tgt){
    const dx=tgt.x-b.x,dist=Math.abs(dx),face=Math.sign(dx)||b.face,c=SOLIDS[0],by=b.y+6;
    let ok;
    if(b.wep==='nade')ok=dist>30&&dist<120&&Math.abs(tgt.y-b.y)<45&&Math.random()<L.nade*0.06;
    else{

function updatePlayer(p,c,control){
  if(p.dead)return;
  const mv=control?(c.right?1:0)-(c.left?1:0):0;
  if(mv)p.face=mv;
  p.mvx+=(mv*1.5-p.mvx)*(p.onGround?0.45:0.3);if(Math.abs(p.mvx)<0.05)p.mvx=0;
  p.vx=p.mvx+p.kx;p.kx*=0.84;if(Math.abs(p.kx)<0.05)p.kx=0;
  const held=control&&c.jump,fresh=held&&!p.jh;
  const gJump=()=>{p.vy=-4.7;p.jumps=1;p.coy=0;p.jbuf=0;S('jump');B(p.x+3,p.y+13,4,['#6a5f7a','#4d4459'],0.8,0.05,14);};
  if(fresh){
    if(p.onGround||p.coy>0)gJump();
    else if(p.jumps<2){p.vy=-4.2;p.jumps=2;p.jbuf=0;S('djump');B(p.x+3,p.y+13,6,['#e8e6f0','#a99bbf'],1,0.02,14);}
    else p.jbuf=8;
  }else if(p.jbuf>0){if(p.onGround)gJump();else p.jbuf--;}
  p.jh=held;
  if(!held&&p.vy<-1.8)p.vy=-1.8;
  if(p.cd>0)p.cd--;
  if(control&&c.shoot&&p.cd<=0)fire(p);
  move(p);
  if(p.onGround){p.jumps=0;p.coy=6;}else if(p.coy>0)p.coy--;
  if(p.flash>0)p.flash--;if(p.zcd>0)p.zcd--;if(p.recoil>0)p.recoil--;
  p.walking=p.onGround&&Math.abs(p.mvx)>0.3;
  if(p.walking)p.anim++;
  p.hpShow+=(p.hp-p.hpShow)*0.06;
}

    if(ready[0]&&ready[1]){if(!titleGo)titleGo=t;if(t-titleGo>40){titleGo=0;ready=[false,false];newMatch();}}

  }

  }

  }

  if(mode==='bot'&&control)botUpdate();

  if(state==='fight'){

  }

  // Kugeln
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i],n=Math.ceil(Math.hypot(b.vx,b.vy)/2.5);let gone=false;
    for(let s=0;s<n&&!gone;s++){
      b.x+=b.vx/n;b.y+=b.vy/n;
      if(b.x<0||b.x>W||b.y<-10||b.y>GROUND){gone=true;if(b.y>=GROUND)B(b.x,GROUND-1,3,['#7a6f86','#f7d51d'],0.8,0.1,10);break;}
      for(const so of SOLIDS)if(b.x>=so.x&&b.x<=so.x+so.w&&b.y>=so.y&&b.y<=so.y+so.h){gone=true;B(b.x,b.y,4,['#f7d51d','#fff3a0'],1,0.1,10);S('bounce');}
      if(gone)break;
      for(const p of players){if(p.dead||p.i===b.owner)continue;

      if(gone)break;
      for(let j=zombies.length-1;j>=0;j--){const z=zombies[j];if(b.x>=z.x-1&&b.x<=z.x+z.w+1&&b.y>=z.y&&b.y<=z.y+z.h){hurtZombie(z,j,b.dmg,Math.sign(b.vx)||1);gone=true;break;}}
    }
    if(!gone&&--b.life<=0)gone=true;

    for(const z of zombies)if(hit(n,z))boom=true;

    if(land!==null&&c.vy>=0){c.y=land-c.h;c.vy=0;c.para=false;}

    if(taken||c.life<=0)crates.splice(i,1);
  }

  for(let i=zombies.length-1;i>=0;i--){
    const z=zombies[i];z.anim++;

    }
    if(t===170){
      if(matchWinner>=0){state='matchEnd';t=0;musicOn=false;S('victory');}
      else{round++;resetRound();}
    }
  }
}

    txt(pname(i),x,7,PCOL[i],R?'right':'left');
    hpBar(p,R?x-22:x+22,R);
    const wp=WEAPONS[p.wep],label=wp.name+(p.ammo===Infinity?'':' '+p.ammo);
    txt(label,R?x:x,19,p.wep==='pistol'?'#a99bbf':p.wep==='raygun'?'#7dff6a':'#f7d51d',R?'right':'left');
    for(let k=0;k<WIN_ROUNDS;k++){const px=R?x-5-k*8:x+k*8;ctx.fillStyle='#0d0912';ctx.fillRect(px+1,31,5,5);ctx.fillStyle=k<wins[i]?PCOL[i]:'#32294a';ctx.fillRect(px,30,5,5);}
  }
  txt('RUNDE '+round,W/2,7,'#a99bbf','center');
}

function render(){
  for(const L of [players,zombies,bullets,crates,nades])for(const e of L){e.rx=e.px==null?e.x:e.px+(e.x-e.px)*alpha;e.ry=e.py==null?e.y:e.py+(e.y-e.py)*alpha;}
  const ox=shake?Math.round((Math.random()*2-1)*shake):0,oy=shake?Math.round((Math.random()*2-1)*shake):0;
  ctx.save();ctx.translate(ox,oy);
  ctx.drawImage(bg,0,0);
  for(const l of LAMPS){
    const lit=hash(((frame/6)|0)*7+l.x)>0.12,x=l.x,dir=l.x<W/2?1:-1,hx=x+dir*6;
    if(lit){ctx.fillStyle='rgba(247,213,29,0.07)';ctx.beginPath();ctx.moveTo(hx,GROUND-58);ctx.lineTo(hx+18,GROUND);ctx.lineTo(hx-18,GROUND);ctx.fill();}
    ctx.fillStyle='#2b2438';ctx.fillRect(x,GROUND-60,2,60);ctx.fillRect(dir>0?x:x-6,GROUND-60,8,2);
    ctx.fillStyle=lit?'#f7d51d':'#4a3f2a';ctx.fillRect(hx-2,GROUND-58,4,2);
  }
  for(const c of crates)drawCrate(c);
  for(const z of zombies){const w=((z.anim/12)|0)&1;draw(z.flash>0?(w?ZS.fb:ZS.fa):(w?ZS.b:ZS.a),Math.round(z.rx-2),Math.round(z.ry),z.face<0);}
  if(state!=='title'&&state!=='matchEnd'||state==='matchEnd'){
    for(const p of players){
      if(p.dead)continue;
      const S=PS[p.i],k=!p.onGround?'jump':p.walking?WALK[((p.anim/5)|0)%4]:'stand';
      draw(p.flash>0?S[k+'W']:S[k],Math.round(p.rx-2),Math.round(p.ry),p.face<0);
      drawGun(p);
      if(state==='count'||(p.zcd>30&&(frame>>2)&1)){ctx.fillStyle=PCOL[p.i];ctx.fillRect(Math.round(p.rx+2),Math.round(p.ry)-5,2,2);}
    }
  }
  for(const b of bullets){
    const x=Math.round(b.rx),y=Math.round(b.ry);
    if(b.kind==='raygun'){ctx.fillStyle='#3bd13b';ctx.fillRect(x-2,y-1,5,3);ctx.fillStyle='#b8ff9e';ctx.fillRect(x-1,y,3,1);ctx.fillStyle='#ffffff';ctx.fillRect(x,y,1,1);}
    else if(b.kind==='sniper'){ctx.fillStyle='#ffffff';ctx.fillRect(b.vx>0?x-5:x,y,6,1);}
    else if(b.kind==='shotgun'){ctx.fillStyle='#ffe58a';ctx.fillRect(x,y,2,1);}
    else{ctx.fillStyle=b.owner?'#bfe3ff':'#ffd8b0';ctx.fillRect(b.vx>0?x-2:x,y,3,1);ctx.fillStyle='#fff3a0';ctx.fillRect(x,y,1,1);}
  }
  for(const n of nades){ctx.fillStyle='#2f4024';ctx.fillRect(Math.round(n.rx),Math.round(n.ry),3,3);ctx.fillStyle=(n.fuse>>2)&1||n.fuse<30&&(n.fuse>>1)&1?'#e0413f':'#4f6b3a';ctx.fillRect(Math.round(n.rx)+1,Math.round(n.ry),1,1);}
  for(const q of parts){ctx.fillStyle=q.col;ctx.fillRect(Math.round(q.x),Math.round(q.y),q.s,q.s);}
  for(const o of pops)txt(o.txt,Math.round(o.x),Math.round(o.y)-8,o.col,'center');
  ctx.restore();
  if(flashA>0){ctx.fillStyle='rgba(255,240,220,'+flashA+')';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='rgba(0,0,0,0.12)';for(let y=0;y<H;y+=2)ctx.fillRect(0,y,W,1);

  if(state==='menu'){}
  else if(state==='title')titleScreen();
  else{
    hud();
    if(state==='count'){
      const n=3-Math.floor((t-1)/40);
      if(n>0)txt(String(n),W/2,62,'#f7d51d','center',24);
    }
    if(state==='fight'&&t<40)txt('LOS!',W/2,62,'#f7d51d','center',24);
    if(state==='count'&&t<60&&round===1)txt('ZERSCHIESS DEN ANDEREN',W/2,96,'#e8e6f0','center');
    if(state==='count'&&round>1)txt('RUNDE '+round,W/2,96,'#e8e6f0','center');
    if(state==='roundEnd'&&t>=45){
      ctx.fillStyle='rgba(13,9,18,0.55)';ctx.fillRect(0,64,W,40);
      if(roundWinner>=0)txt(mode==='bot'&&roundWinner===0?'DU HOLST DIE RUNDE':pname(roundWinner)+' HOLT DIE RUNDE',W/2,74,PCOL[roundWinner],'center');
      else txt('UNENTSCHIEDEN',W/2,74,'#e8e6f0','center');
      txt(wins[0]+' : '+wins[1],W/2,88,'#e8e6f0','center');
    }
    if(state==='matchEnd')matchScreen();
  }
}
function titleScreen(){
  ctx.fillStyle='rgba(13,9,18,0.5)';ctx.fillRect(0,0,W,H);
  const bob=Math.round(Math.sin(frame/20)*1.5);
  txt('RUINENDUELL',W/2+2,26+bob+2,'#7a1420','center',16);
  txt('RUINENDUELL',W/2,26+bob,'#e0413f','center',16);
  txt('NUR EINER STEHT AM ENDE',W/2,52,'#a99bbf','center');
  for(let i=0;i<2;i++){
    const cx=i?W/2+60:W/2-60,S=PS[i];
    draw(S.stand,cx-10,78,i===1,2);
    ctx.fillStyle=i?'#9aa0a8':'#9aa0a8';ctx.fillRect(i?cx-16:cx+10,90,6,2);
    txt('P'+(i+1),cx,112,PCOL[i],'center');
    if(mode!=='local'&&i===me)txt('DU',cx,66,'#e8e6f0','center');
    if(mode==='bot'&&i===1)txt(ready[1]?'BEREIT!':'BOT',cx,126,ready[1]?'#7fdc6a':'#e8e6f0','center'),txt(BOT[botLvl].name,cx,138,'#a99bbf','center');
    else if(ready[i])txt('BEREIT!',cx,126,'#7fdc6a','center');
    else if((frame>>5)&1)txt('DRÜCK A',cx,126,'#e8e6f0','center');
  }
  txt('VS',W/2,94,'#f7d51d','center',16);
  txt('3 RUNDEN GEWINNEN',W/2,158,'#6a5f80','center');
}
function matchScreen(){
  ctx.fillStyle='rgba(13,9,18,0.72)';ctx.fillRect(0,0,W,H);
  const w=matchWinner;
  const wt=mode==='bot'?(w===0?'GEWONNEN!':'VERLOREN!'):'P'+(w+1)+' GEWINNT!';
  txt(wt,W/2+2,40+2,PCOL_D[w],'center',16);
  txt(wt,W/2,40,PCOL[w],'center',16);
  if(mode==='bot')txt('BOT '+BOT[botLvl].name,W/2,62,'#a99bbf','center');
  const bob=Math.round(Math.abs(Math.sin(frame/8))*-6);
  draw(PS[w].jump,W/2-10,74+bob,false,2);
  txt(wins[0]+' : '+wins[1],W/2,112,'#e8e6f0','center');
  if(t>120&&(frame>>5)&1)txt('A DRÜCKEN: REVANCHE',W/2,140,'#f7d51d','center');
}

/* ---------- Online (PeerJS / WebRTC) ---------- */
const menuEl=document.getElementById('menu'),appEl=document.getElementById('app');
const MS={};['m-main','m-bot','m-host','m-join','m-err'].forEach(id=>MS[id]=document.getElementById(id));
const $=id=>document.getElementById(id);
function showM(id){menuEl.hidden=false;for(const k in MS)MS[k].hidden=k!==id;}
const PSRV=(()=>{try{const v=new URLSearchParams(location.search).get('ps');if(v){const a=v.split(':');return {host:a[0],port:+a[1]||9000,path:'/',secure:false};}}catch(e){}return {};})();
const ABC='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode=()=>Array.from({length:4},()=>ABC[(Math.random()*ABC.length)|0]).join('');
let peer=null,code='',joinTimer=0,lastSent='',sendT=0,gHp=[100,100];
function cleanupNet(){clearTimeout(joinTimer);const c=conn,p=peer;conn=null;peer=null;try{c&&c.close();}catch(e){}try{p&&p.destroy();}catch(e){}}
function resetPlay(){players=[makePlayer(0),makePlayer(1)];bullets=[];nades=[];crates=[];zombies=[];parts=[];pops=[];wins=[0,0];round=1;}
function toLocalMenu(){mode='local';me=0;state='menu';musicOn=false;remote=[{},{}];gp=[{},{}];evQ=[];appEl.classList.remove('online','me0','me1');resetPlay();sync();requestAnimationFrame(fit);}
function toMenu(){cleanupNet();toLocalMenu();$('join-hint').textContent='';showM('m-main');}
function fail(msg){cleanupNet();toLocalMenu();$('err-msg').textContent=msg;showM('m-err');}
function startGame(m,who){
  mode=m;me=who;menuEl.hidden=true;resetPlay();ready=[false,false];titleGo=0;state='title';t=0;
  remote=[{},{}];gp=[{},{}];evQ=[];lastSent='';gHp=[100,100];ptr.clear();sync();
  appEl.classList.toggle('online',m!=='local');appEl.classList.remove('me0','me1');if(m!=='local')appEl.classList.add('me'+who);
  requestAnimationFrame(fit);
}
function netMsg(e){
  const ty=e&&e.type;
  if(ty==='network'||ty==='server-error'||ty==='socket-error'||ty==='socket-closed')return 'Keine Verbindung zum Spielserver. Bist du online?';
  if(ty==='browser-incompatible')return 'Dieser Browser kann den Online-Modus nicht. Nimm Safari oder Chrome.';
  return 'Verbindung fehlgeschlagen ('+(ty||'unbekannt')+'). Versucht es nochmal.';
}
function hasPeer(){if(typeof Peer==='undefined'){fail('Der Online-Modus konnte nicht geladen werden. Lade die Seite neu.');return false;}return true;}
function hostGame(){
  if(!hasPeer())return;cleanupNet();code=genCode();
  $('host-code').textContent=code;$('host-status').textContent='Verbinde mit Spielserver …';showM('m-host');
  const p=peer=new Peer('ruinenduell-'+code,PSRV);
  p.on('open',()=>{if(peer===p)$('host-status').textContent='Warte auf deinen Freund …';});
  p.on('connection',c=>{
    if(conn){try{c.close();}catch(e){}return;}
    conn=c;
    c.on('open',()=>{startGame('host',0);S('ready');});
    c.on('data',d=>{if(!d||conn!==c)return;if(d.t==='i'){remote[1]=d.k||{};sync();}else if(d.t==='p')pressQ[1]=true;});
    c.on('close',()=>{if(conn===c&&mode==='host')fail('Dein Freund hat das Spiel verlassen.');});
  });
  p.on('error',e=>{if(peer!==p)return;if(e&&e.type==='unavailable-id'){hostGame();return;}if(mode==='host'&&conn&&conn.open)return;fail(netMsg(e));});
  p.on('disconnected',()=>{if(peer===p&&!p.destroyed){try{p.reconnect();}catch(e){}}});
}
function joinGame(){
  if(!hasPeer())return;
  const c=($('code').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(c.length!==4){$('join-hint').textContent='Gib den 4-stelligen Code deines Freundes ein.';return;}
  cleanupNet();code=c;$('join-status').textContent='Verbinde mit Spiel '+c+' …';showM('m-join');
  const p=peer=new Peer(PSRV);
  p.on('open',()=>{
    if(peer!==p)return;
    const k=conn=p.connect('ruinenduell-'+c,{reliable:true,serialization:'json'});
    k.on('open',()=>{clearTimeout(joinTimer);startGame('guest',1);});
    k.on('data',d=>{if(conn===k)applySnap(d);});
    k.on('close',()=>{if(conn===k&&mode==='guest')fail('Die Verbindung zum Spiel ist abgebrochen.');});
  });
  p.on('error',e=>{if(peer!==p)return;if(mode==='guest'&&conn&&conn.open)return;
    fail(e&&e.type==='peer-unavailable'?'Kein Spiel mit dem Code '+c+' gefunden. Prüf den Code und ob dein Freund noch wartet.':netMsg(e));});
  joinTimer=setTimeout(()=>{if(peer===p&&mode!=='guest')fail('Die Verbindung dauert zu lange. Probiert es im selben WLAN oder erstellt ein neues Spiel.');},20000);
}
const r1=v=>Math.round(v*10)/10;
function sendSnap(){
  if(!conn||!conn.open){evQ=[];return;}
  const d={t:'s',s:state,tt:t,r:round,w:wins,rw:roundWinner,mw:matchWinner,rd:ready,sh:r1(shake),fl:r1(flashA),
    p:players.map(p=>[r1(p.x),r1(p.y),p.face,Math.round(p.hp),p.wep,p.ammo===Infinity?-1:p.ammo,p.dead?1:0,p.flash,p.onGround?1:0,p.walking?1:0,p.anim,p.recoil,p.zcd]),
    b:bullets.map(b=>[r1(b.x),r1(b.y),r1(b.vx),b.kind,b.owner]),
    n:nades.map(n=>[r1(n.x),r1(n.y),n.fuse]),
    c:crates.map(c=>[r1(c.x),r1(c.y),c.loot,c.para?1:0,c.life]),
    z:zombies.map(z=>[r1(z.x),r1(z.y),z.face,z.flash,z.anim]),
    e:evQ};
  evQ=[];
  try{conn.send(d);}catch(e){}
}
function applySnap(d){
  if(!d||d.t!=='s')return;
  state=d.s;t=d.tt;round=d.r;wins=d.w;roundWinner=d.rw;matchWinner=d.mw;ready=d.rd;shake=d.sh;flashA=d.fl;
  players=d.p.map((a,i)=>({i,x:a[0],y:a[1],face:a[2],hp:a[3],wep:a[4],ammo:a[5]<0?Infinity:a[5],dead:!!a[6],flash:a[7],onGround:!!a[8],walking:!!a[9],vx:0,anim:a[10],recoil:a[11],zcd:a[12],w:6,h:13,hpShow:gHp[i]}));
  if(state==='count'||state==='title')gHp=players.map(p=>p.hp);
  bullets=d.b.map(a=>({x:a[0],y:a[1],vx:a[2],kind:a[3],owner:a[4]}));
  nades=d.n.map(a=>({x:a[0],y:a[1],fuse:a[2]}));
  crates=d.c.map(a=>({x:a[0],y:a[1],loot:a[2],para:!!a[3],life:a[4]}));
  zombies=d.z.map(a=>({x:a[0],y:a[1],face:a[2],flash:a[3],anim:a[4]}));
  for(const e of d.e||[]){
    const k=e[0],v=e[1];
    if(k==='s'){if(Object.prototype.hasOwnProperty.call(sfx,v))sfx[v]();}
    else if(k==='b'&&Array.isArray(v))burst(...v);
    else if(k==='p')pops.push(v);
    else if(k==='t')parts.push(v);
  }
  const on=state==='count'||state==='fight'||state==='roundEnd';
  if(on&&!musicOn)step=0;musicOn=on;
}
function guestTick(){
  frame++;pollPads();
  if(conn&&conn.open){
    const k=inp[1],o={left:k.left,right:k.right,jump:k.jump,shoot:k.shoot},s=JSON.stringify(o);
    if(s!==lastSent||++sendT>20){lastSent=s;sendT=0;try{conn.send({t:'i',k:o});}catch(e){}}
    if(pressQ[1]){try{conn.send({t:'p'});}catch(e){}}
  }
  pressQ[0]=pressQ[1]=false;
  for(const p of players){gHp[p.i]+=(p.hp-gHp[p.i])*0.06;p.hpShow=gHp[p.i];}
  if(shake>0){shake*=0.82;if(shake<0.3)shake=0;}
  if(flashA>0)flashA=Math.max(0,flashA-0.04);
  updateFx();
}
$('b-local').addEventListener('click',()=>{initAudio();startGame('local',0);});
$('b-bot').addEventListener('click',()=>{initAudio();showM('m-bot');});
$('b-bot-back').addEventListener('click',()=>showM('m-main'));
[['b-easy','leicht'],['b-mid','mittel'],['b-hard','schwer']].forEach(([id,l])=>$(id).addEventListener('click',()=>{initAudio();botLvl=l;botReset();startGame('bot',0);}));
$('b-host').addEventListener('click',()=>{initAudio();hostGame();});
$('b-join').addEventListener('click',()=>{initAudio();joinGame();});
$('code').addEventListener('input',e=>{const v=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(v!==e.target.value)e.target.value=v;$('join-hint').textContent='';});
$('code').addEventListener('keydown',e=>{if(e.key==='Enter'){initAudio();joinGame();}});
['b-cancel-host','b-cancel-join','b-back'].forEach(id=>$(id).addEventListener('click',toMenu));
$('b-menu').addEventListener('pointerdown',e=>e.stopPropagation());
$('b-menu').addEventListener('click',e=>{e.stopPropagation();toMenu();});
$('b-share').addEventListener('click',async()=>{
  const url=location.origin+location.pathname+'#'+code,text='Komm ins Ruinenduell! Code: '+code;
  try{if(navigator.share){await navigator.share({title:'Ruinenduell',text,url});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(text+'  '+url);$('host-status').textContent='Link kopiert. Schick ihn deinem Freund.';}
  catch(e){$('host-status').textContent=url;}
});
(()=>{const h=(location.hash||'').slice(1).toUpperCase();if(/^[A-Z0-9]{4}$/.test(h)){$('code').value=h;$('join-hint').textContent='Code übernommen. Drück BEITRETEN.';}})();

/* ---------- Schleife ---------- */
let last=performance.now(),acc=0,running=true,alpha=1;const WALK=['walk','stand','walk2','stand'];
function loop(now){
  if(running){acc+=Math.min(100,now-last);while(acc>=1000/60){if(mode==='guest')guestTick();else{update();if(mode==='host')sendSnap();}acc-=1000/60;}alpha=mode==='guest'?1:Math.min(1,acc/(1000/60));music();render();}
  last=now;requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{running=!document.hidden;if(actx){running?actx.resume():actx.suspend();}});
players=[makePlayer(0),makePlayer(1)];
const go=()=>requestAnimationFrame(loop);
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load('8px '+FONT),new Promise(r=>setTimeout(r,1500))]).then(go,go);}else go();
})();
</script>
<script>
if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));}
</script>
